<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School STEM Scraper Pro</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>🔬 Smart School Scraper</h2>
            <div id="status-badge" class="badge idle">Idle</div>
        </header>

        <section class="controls">
            <div class="domain-info">
                <strong>Target Domain: </strong> <span id="current-domain">Not detected</span>
            </div>
            
            <div class="button-group">
                <button id="btn-start" class="primary">Start Crawl</button>
                <button id="btn-pause" class="secondary" disabled>Pause</button>
                <button id="btn-resume" class="secondary" disabled>Resume</button>
                <button id="btn-clear" class="danger">Clear Data</button>
                <button id="btn-export" class="success">Export CSV</button>
            </div>

            <div class="stats">
                <p>Pages Crawled: <span id="pages-crawled">0</span> / 150</p>
                <p>Scanning: <span id="current-url" style="font-size: 0.8em; color: #666; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px;">Idle</span></p>
                <div class="stat-grid">
                    <p>Total: <span id="teachers-found">0</span></p>
                    <p>STEM: <span id="stem-found" class="text-success">0</span></p>
                    <p>Leadership: <span id="leadership-found" class="text-primary">0</span></p>
                </div>
            </div>
        </section>

        <section class="results">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>Score</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Type</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
        </section>
    </div>
    <script src="popup.js"></script>
</body>
</html>
